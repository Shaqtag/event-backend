spring.application.name=prestation_service

# PostgreSQL Configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/prestationdb 
spring.datasource.username=postgres
spring.datasource.password=Rivaldo
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.org.springframework=DEBUG
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator (pour le monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JWT Validation (si vous utilisez OAuth2)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-service:8080
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8080/oauth2/jwks

# MongoDB Configuration

spring.data.mongodb.uri=mongodb://localhost:27017/servicedb
#spring.data.mongodb.database=servicedb

