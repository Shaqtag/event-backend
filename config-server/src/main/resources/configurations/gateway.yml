eureka:
  client:
    register-with-eureka: false

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: authentification
          uri: http://localhost:8050
          predicates:
            - Path=/api/v1/auth/**

      discovery:
        locator:
          enabled: true

server:
  port: 8222

management:
  tracing:
    sampling:
      probability: 1.0